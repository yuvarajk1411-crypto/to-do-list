<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — To-Do List</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9.5 16.5l4.2 4.2L22.5 11.5' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </div>
        <div>
          <h1>TaskFlow</h1>
          <p class="subtitle" id="today-date">Stay focused, ship what matters</p>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="icon-btn" id="export-btn" title="Export tasks as JSON" aria-label="Export tasks as JSON">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span class="btn-label">Export</span>
        </button>

        <label class="icon-btn" for="import-input" title="Import tasks from JSON" aria-label="Import tasks from JSON">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <span class="btn-label">Import</span>
          <input type="file" id="import-input" accept="application/json,.json" hidden />
        </label>

        <button type="button" class="icon-btn" id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle theme">
          <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </header>

    <section class="stats-card" aria-label="Task progress">
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-value" id="stat-total">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="stat-active">0</span>
          <span class="stat-label">Active</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="stat-completed">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-item">
          <span class="stat-value stat-overdue" id="stat-overdue">0</span>
          <span class="stat-label">Overdue</span>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-text" id="progress-text">0% complete</span>
      </div>
    </section>

    <section class="composer-card" aria-label="Add new task">
      <form id="task-form" autocomplete="off">
        <div class="composer-main">
          <input
            type="text"
            id="task-title"
            placeholder="Add a new task... (Press N to focus)"
            maxlength="200"
            required
            aria-label="Task title"
          />
          <button type="submit" class="primary-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            <span>Add Task</span>
          </button>
        </div>

        <div class="composer-meta">
          <div class="meta-field">
            <label for="task-priority">Priority</label>
            <select id="task-priority" aria-label="Task priority">
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>

          <div class="meta-field">
            <label for="task-due">Due Date</label>
            <input type="date" id="task-due" aria-label="Task due date" />
          </div>

          <div class="meta-field">
            <label for="task-category">Category</label>
            <input type="text" id="task-category" list="category-suggestions" placeholder="e.g. Work" maxlength="30" aria-label="Task category" />
            <datalist id="category-suggestions">
              <option value="Work"></option>
              <option value="Personal"></option>
              <option value="Learning"></option>
              <option value="Errands"></option>
            </datalist>
          </div>

          <div class="meta-field meta-notes">
            <label for="task-notes">Notes</label>
            <input type="text" id="task-notes" placeholder="Optional details..." maxlength="300" aria-label="Task notes" />
          </div>
        </div>
      </form>
    </section>

    <section class="controls-bar" aria-label="Filter and sort tasks">
      <div class="filter-tabs" role="tablist" aria-label="Task status filter">
        <button type="button" class="tab-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button type="button" class="tab-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button type="button" class="tab-btn" data-filter="today" role="tab" aria-selected="false">Today &amp; Overdue</button>
        <button type="button" class="tab-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>

      <div class="search-sort">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="search" id="search-input" placeholder="Search tasks... (/)" aria-label="Search tasks" />
        </div>

        <select id="priority-filter" aria-label="Filter by priority">
          <option value="all">All Priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>

        <select id="category-filter" aria-label="Filter by category">
          <option value="all">All Categories</option>
        </select>

        <select id="sort-select" aria-label="Sort tasks">
          <option value="manual">Manual Order</option>
          <option value="due">Due Date</option>
          <option value="priority">Priority</option>
          <option value="newest">Newest First</option>
        </select>
      </div>
    </section>

    <main class="task-list-section">
      <div class="list-header">
        <span id="visible-count" class="visible-count">0 tasks shown</span>
        <button type="button" class="text-btn" id="clear-completed-btn" hidden>Clear completed</button>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-illustration" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="6" width="32" height="36" rx="4" />
            <line x1="16" y1="16" x2="32" y2="16" />
            <line x1="16" y1="24" x2="28" y2="24" />
            <line x1="16" y1="32" x2="24" y2="32" />
          </svg>
        </div>
        <h2 id="empty-title">No tasks yet</h2>
        <p id="empty-subtitle">Add a task above to organize your day.</p>
      </div>
    </main>

    <footer class="app-footer">
      <span>Saved automatically in your browser</span>
      <span>Shortcuts: <kbd>N</kbd> new task &middot; <kbd>/</kbd> search &middot; Drag tasks to reorder</span>
    </footer>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal-backdrop" id="edit-modal" hidden role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="edit-modal-title">Edit Task</h2>
        <button type="button" class="icon-btn" id="close-modal-btn" aria-label="Close edit dialog">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <form id="edit-form">
        <input type="hidden" id="edit-id" />
        <div class="form-group">
          <label for="edit-title">Title</label>
          <input type="text" id="edit-title" maxlength="200" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="edit-priority">Priority</label>
            <select id="edit-priority">
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="form-group">
            <label for="edit-due">Due Date</label>
            <input type="date" id="edit-due" />
          </div>
        </div>
        <div class="form-group">
          <label for="edit-category">Category</label>
          <input type="text" id="edit-category" list="category-suggestions" maxlength="30" />
        </div>
        <div class="form-group">
          <label for="edit-notes">Notes</label>
          <textarea id="edit-notes" rows="3" maxlength="300"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary-btn" id="cancel-edit-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-message"></span>
    <button type="button" class="toast-action" id="toast-action" hidden>Undo</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
